<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Restaurants &amp; Food | Swiggy</title>
  <meta name="description" content="Search for restaurants and food on Swiggy. Find your favourite cuisine.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
    <!-- navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="index.html" class="logo-link" title="Swiggy">
          <svg viewBox="0 0 40 48" width="40" height="48" fill="none" xmlns="http://www.w3.org/2000/svg" class="swiggy-header-logo">
  <rect width="40" height="48" rx="14" fill="#FC8019"/>
  <path fill-rule="evenodd" clip-rule="evenodd" d="M20 10C13.3726 10 8 15.3726 8 22C8 28.6274 13.3726 34 20 34C21.6569 34 23.2355 33.6644 24.6738 33.0573C23.9157 34.6193 22.1772 35.6842 20.1802 35.6842C18.6143 35.6842 17.2052 35.0315 16.2038 33.9877L12.4804 37.7111C14.4239 39.6546 17.1448 40.7368 20.1802 40.7368C26.6558 40.7368 31.9053 35.4873 31.9053 29.0117V22C31.9053 15.3726 26.6274 10 20 10ZM20 28C16.6863 28 14 25.3137 14 22C14 18.6863 16.6863 16 20 16C23.3137 16 26 18.6863 26 22C26 25.3137 23.3137 28 20 28Z" fill="white"/>
</svg>
        </a>
        <button class="location-btn" id="locationBtn">
          <span class="location-text">Other</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="#FC8019" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
      <div class="nav-right">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          Swiggy Corporate
        </a>
        <a href="search.html" class="nav-link active-nav-link" id="navSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </a>
        <a href="#" class="nav-link offers-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Offers<sup class="new-badge">NEW</sup>
        </a>
        <a href="help.html" class="nav-link" id="navHelp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Help
        </a>
        <a href="#" class="nav-link" id="signInBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Sign In
        </a>
        <a href="cart.html" class="nav-link cart-link" id="navCart">
          <span class="cart-icon-wrapper" id="cartIconWrapper">
            <span class="cart-zero-badge" id="cartZeroBadge">0</span>
            <span class="cart-green-badge" id="cartGreenBadge" style="display:none">0</span>
          </span>
          <span class="cart-label-text" id="cartLabelText">Cart</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- search section -->
  <div class="search-page-wrap">
    <!-- search bar -->
    <div class="search-bar-wrap">
      <div class="search-input-row">
        <svg class="search-page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-page-input" placeholder="Search for restaurants and food" autofocus oninput="handleSearch(this.value)">
        <button class="search-clear-btn" id="clearBtn" onclick="clearSearch()" style="display:none">✕</button>
      </div>
    </div>

    <!-- search results -->
    <div id="searchResults" class="search-results" style="display:none">
      <div id="resultsGrid" class="results-grid"></div>
    </div>

    <!-- default state: popular cuisines -->
    <div id="defaultState" class="default-state">
      <h2 class="search-section-title">Popular Cuisines</h2>
      <div class="cuisines-grid">
        <a href="#" class="cuisine-item" onclick="searchCuisine('Rolls')">
          <img src="assets/cat/rolls.svg" alt="Rolls">
          <span>Rolls</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Tea')">
          <img src="assets/cat/tea.svg" alt="Tea">
          <span>Tea</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Cake')">
          <img src="assets/cat/cake.svg" alt="Cake">
          <span>Cake</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Dessert')">
          <img src="assets/cat/dessert.svg" alt="Dessert">
          <span>Dessert</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Sandwich')">
          <img src="assets/cat/sandwich.svg" alt="Sandwich">
          <span>Sandwich</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Beverages')">
          <img src="assets/cat/beverages.svg" alt="Beverages">
          <span>Beverages</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Biryani')">
          <img src="assets/cat/biryani.svg" alt="Biryani">
          <span>Biryani</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Pizza')">
          <img src="assets/cat/pizza.svg" alt="Pizza">
          <span>Pizza</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Burger')">
          <img src="assets/cat/burger.svg" alt="Burger">
          <span>Burger</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Pasta')">
          <img src="assets/cat/pasta.svg" alt="Pasta">
          <span>Pasta</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Dosa')">
          <img src="assets/cat/dosa.svg" alt="Dosa">
          <span>Dosa</span>
        </a>
        <a href="#" class="cuisine-item" onclick="searchCuisine('Chicken')">
          <img src="assets/cat/chicken.svg" alt="Chicken">
          <span>Chicken</span>
        </a>
      </div>
    </div>
  </div>

  <!-- sign in drawer -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeSignIn()"></div>
  <div class="signin-drawer" id="signinDrawer">
    <button class="drawer-close" onclick="closeSignIn()">✕</button>
    <div class="drawer-content">
      <div class="drawer-header">
        <div>
          <h2>Login</h2>
          <p>or <a href="#" class="create-account-link">create an account</a></p>
          <div class="drawer-underline"></div>
        </div>
      </div>
      <div class="form-group">
        <input type="tel" id="phoneInput" class="phone-input" placeholder="Phone number" maxlength="10">
      </div>
      <button class="login-btn" onclick="handleLogin()">LOGIN</button>
      <p class="terms-text">By clicking on Login, I accept the <a href="#">Terms &amp; Conditions</a> &amp; <a href="#">Privacy Policy</a></p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
