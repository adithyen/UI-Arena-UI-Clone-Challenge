<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_chin" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg_chin)"/>
  <!-- Wok / Plate -->
  <ellipse cx="200" cy="140" rx="150" ry="90" fill="#1c1c1c"/>
  <ellipse cx="200" cy="135" rx="140" ry="82" fill="#424242"/>
  <!-- Fried Rice -->
  <ellipse cx="200" cy="135" rx="130" ry="75" fill="#ffe082"/>
  <!-- Grains & Veggies -->
  <g fill="#ff9800">
    <circle cx="150" cy="120" r="4"/><circle cx="180" cy="110" r="5"/><circle cx="220" cy="130" r="4"/>
    <circle cx="240" cy="115" r="5"/><circle cx="170" cy="145" r="4"/><circle cx="210" cy="150" r="5"/>
  </g>
  <g fill="#4caf50">
    <rect x="130" y="130" width="8" height="4" rx="1"/><rect x="190" y="125" width="7" height="4" rx="1"/>
    <rect x="230" y="140" width="9" height="4" rx="1"/><rect x="160" y="150" width="7" height="4" rx="1"/>
  </g>
  <g fill="#e53935">
    <rect x="140" y="110" width="6" height="6" rx="1"/><rect x="210" y="115" width="7" height="6" rx="1"/>
    <rect x="180" y="140" width="6" height="6" rx="1"/><rect x="250" y="130" width="7" height="6" rx="1"/>
  </g>
  <!-- Chopsticks -->
  <line x1="270" y1="60" x2="190" y2="150" stroke="#d7ccc8" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="60" x2="200" y2="155" stroke="#d7ccc8" stroke-width="5" stroke-linecap="round"/>
</svg>